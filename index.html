<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데이트백</title>
<meta name="theme-color" content="#262A29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="데이트백">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="exifr.umd.js"></script>
<style>
:root{
  --bg:#D9DBD7; --surface:#ECEDEA; --ink:#1E2321; --muted:#5B635F; --line:#B7BCB7;
  --accent:#2F5D5A; --accent-ink:#FFFFFF; --led:#FF7A1A; --frame:#262A29;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E1D; --surface:#252928; --ink:#E7E9E6; --muted:#9BA39F; --line:#3B413F;
    --accent:#86B8B2; --accent-ink:#10201E; --frame:#0F1211;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E1D; --surface:#252928; --ink:#E7E9E6; --muted:#9BA39F; --line:#3B413F;
  --accent:#86B8B2; --accent-ink:#10201E; --frame:#0F1211;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 2px 14px}
h1{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.9rem}
.layout{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.stage{background:var(--frame);border-radius:6px;padding:14px;position:relative;min-height:220px;
  display:flex;align-items:center;justify-content:center}
.stage canvas{display:block;max-width:100%;max-height:72vh;height:auto;width:auto;border-radius:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 10px;text-align:center;color:#C9CECB}
.empty canvas{max-width:100%;border-radius:2px}
.empty small{color:#8E9692}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.thumb{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:4px;overflow:hidden;
  border:2px solid transparent;padding:0;background:var(--frame);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--led)}
.thumb .nodate{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;font-size:10px;padding:0 4px;border-radius:2px}
.thumb .del{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;border:0;
  background:#000b;color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.panel{background:var(--surface);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:20px}
.group h2{font-size:.95rem;font-weight:600;margin:0 0 8px}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:7px 13px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
input[type="date"]{font:inherit;font-size:1rem;width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px;margin-top:10px}
input[type="date"].need{border-color:var(--led);box-shadow:0 0 0 2px color-mix(in srgb,var(--led) 30%,transparent)}
.row{display:flex;align-items:center;gap:12px}
.row label{flex:0 0 52px;font-size:.9rem;color:var(--muted)}
input[type="range"]{flex:1;accent-color:var(--accent);min-height:32px}
.exifline{font-size:.9rem;margin:8px 0 0}
.exifline b{font-weight:600}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);padding:6px 0 0;cursor:pointer;text-decoration:underline}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:600;font-size:1rem;border:0;border-radius:6px;padding:12px 16px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.92rem;max-width:90vw;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:10}
.sheet.open{display:flex}
.sheet img{max-width:100%;max-height:58vh;object-fit:contain;border-radius:2px}
.sheet p{color:#fff;margin:0;text-align:center;font-size:.95rem}
.sheet .btns{display:flex;flex-direction:column;gap:8px;width:min(360px,100%)}
.sheet .btn.ghost{color:#fff;border-color:#fff6}
.drag .stage{outline:3px dashed var(--led);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>데이트백</h1>
    <p>사진에 옛날 필름카메라식 날짜를 새깁니다</p>
  </header>

  <div class="layout">
    <div>
      <div class="stage" id="stage">
        <div class="empty" id="empty">
          <canvas id="demo" width="640" height="420" aria-hidden="true"></canvas>
          <button class="btn primary" id="pickEmpty">사진 불러오기</button>
          <small>여러 장을 한 번에 고를 수 있습니다</small>
        </div>
        <canvas id="view" hidden aria-label="날짜가 새겨진 사진 미리보기"></canvas>
      </div>
      <div class="strip" id="strip" aria-label="불러온 사진"></div>
    </div>

    <aside class="panel" id="panel">
      <div class="group">
        <h2>날짜</h2>
        <div class="seg" id="srcSeg">
          <button data-src="exif" aria-pressed="true">사진 정보 날짜</button>
          <button data-src="manual" aria-pressed="false">직접 입력</button>
        </div>
        <p class="exifline" id="exifLine">사진을 불러오면 촬영 날짜를 읽어옵니다.</p>
        <div id="manualBox" hidden>
          <input type="date" id="dateInput" min="1950-01-01" max="2099-12-31" aria-label="새길 날짜">
          <button class="linkbtn" id="applyAll" hidden>이 날짜를 모든 사진에 적용</button>
        </div>
      </div>

      <div class="group">
        <h2>표기 형식</h2>
        <div class="seg" id="fmtSeg"></div>
      </div>

      <div class="group">
        <h2>위치</h2>
        <div class="seg" id="posSeg">
          <button data-pos="br" aria-pressed="true">오른쪽 아래</button>
          <button data-pos="bl" aria-pressed="false">왼쪽 아래</button>
          <button data-pos="tr" aria-pressed="false">오른쪽 위</button>
          <button data-pos="tl" aria-pressed="false">왼쪽 위</button>
        </div>
      </div>

      <div class="group">
        <h2>모양</h2>
        <div class="row"><label for="size">크기</label><input type="range" id="size" min="2" max="12" step="0.25" value="5"></div>
        <div class="row"><label for="glow">번짐</label><input type="range" id="glow" min="0" max="1" step="0.05" value="0.5"></div>
        <div class="row"><label for="tilt">기울기</label><input type="range" id="tilt" min="0" max="0.25" step="0.01" value="0.1"></div>
        <div class="seg" id="colSeg" style="margin-top:10px">
          <button data-col="orange" aria-pressed="true">주황</button>
          <button data-col="red" aria-pressed="false">붉은 주황</button>
          <button data-col="amber" aria-pressed="false">노란 주황</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="saveOne" disabled>이 사진 저장</button>
        <p class="hint" id="sizeInfo" hidden></p>
        <button class="btn ghost" id="saveAll" hidden>모든 사진 저장</button>
        <button class="btn ghost" id="pickMore">사진 추가</button>
      </div>
    </aside>
  </div>
</div>

<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shMsg">
  <img id="shImg" alt="날짜가 새겨진 사진" hidden>
  <p id="shMsg"></p>
  <div class="btns">
    <button class="btn primary" id="shShare" hidden>사진 앱에 저장 · 공유</button>
    <button class="btn ghost" id="shDown" hidden>파일로 내려받기</button>
    <button class="btn ghost" id="shClose" hidden>닫기</button>
  </div>
  <p id="shHint" style="font-size:.82rem;color:#bbb" hidden>버튼이 동작하지 않으면 사진을 길게 눌러 저장하세요.</p>
</div>

			var codevalue = 0;
			var pos_in_table = 0;
			var HT = new Array();
			for (var k = 1; k <= 16; k++) {
				for (var j = 1; j <= nrcodes[k]; j++) {

					HT[std_table[pos_in_table]][0] = codevalue;
					HT[std_table[pos_in_table]][1] = k;
					pos_in_table++;
					codevalue++;
				}

			}
			return HT;
		}

					bitcode[32767+nrneg] = [];
					bitcode[32767+nrneg][1] = cat;
					bitcode[32767+nrneg][0] = nrupper-1+nrneg;
				}
				nrlower <<= 1;
				nrupper <<= 1;
			}
		}
		
		function initRGBYUVTable() {
			for(var i = 0; i < 256;i++) {
				RGB_YUV_TABLE[i]      		=  19595 * i;
				RGB_YUV_TABLE[(i+ 256)>>0] 	=  38470 * i;
				RGB_YUV_TABLE[(i+ 512)>>0] 	=   7471 * i + 0x8000;
				RGB_YUV_TABLE[(i+ 768)>>0] 	= -11059 * i;
				RGB_YUV_TABLE[(i+1024)>>0] 	= -21709 * i;
				RGB_YUV_TABLE[(i+1280)>>0] 	=  32768 * i + 0x807FFF;
				RGB_YUV_TABLE[(i+1536)>>0] 	= -27439 * i;
				RGB_YUV_TABLE[(i+1792)>>0] 	= - 5329 * i;
			}
		}
		
		// IO functions
		function writeBits(bs)
		{
			var value = bs[0];
			var posval = bs[1]-1;
			while ( posval >= 0 ) {
				if (value & (1 << posval) ) {
					bytenew |= (1 << bytepos);
				}
				posval--;
				bytepos--;
				if (bytepos < 0) {
					if (bytenew == 0xFF) {
						writeByte(0xFF);
						writeByte(0);
					}
					else {
						writeByte(bytenew);
					}
					bytepos=7;
					bytenew=0;
				}
			}
		}
	
		function writeByte(value)
		{
			//byteout.push(clt[value]); // write char directly instead of converting later
      if (bufPos === buf.length) { chunks.push(buf); buf = new Uint8Array(1<<20); bufPos = 0; }
      buf[bufPos++] = value;
		}
	
		function writeWord(value)
		{
			writeByte((value>>8)&0xFF);
			writeByte((value   )&0xFF);
		}
		
		// DCT & quantization core
		function fDCTQuant(data, fdtbl)
		{
			var d0, d1, d2, d3, d4, d5, d6, d7;
			/* Pass 1: process rows. */
			var dataOff=0;
			var i;
			var I8 = 8;
			var I64 = 64;
			for (i=0; i<I8; ++i)
			{
				d0 = data[dataOff];
				d1 = data[dataOff+1];
				d2 = data[dataOff+2];
				d3 = data[dataOff+3];
				d4 = data[dataOff+4];
				d5 = data[dataOff+5];
				d6 = data[dataOff+6];
				d7 = data[dataOff+7];
				
				var tmp0 = d0 + d7;
				var tmp7 = d0 - d7;
				var tmp1 = d1 + d6;
				var tmp6 = d1 - d6;
				var tmp2 = d2 + d5;
				var tmp5 = d2 - d5;
				var tmp3 = d3 + d4;
				var tmp4 = d3 - d4;
	
				/* Even part */
				var tmp10 = tmp0 + tmp3;	/* phase 2 */
				var tmp13 = tmp0 - tmp3;
				var tmp11 = tmp1 + tmp2;
				var tmp12 = tmp1 - tmp2;
	
				data[dataOff] = tmp10 + tmp11; /* phase 3 */
				data[dataOff+4] = tmp10 - tmp11;
	
				var z1 = (tmp12 + tmp13) * 0.707106781; /* c4 */
				data[dataOff+2] = tmp13 + z1; /* phase 5 */
				data[dataOff+6] = tmp13 - z1;
	
				/* Odd part */
				tmp10 = tmp4 + tmp5; /* phase 2 */
				tmp11 = tmp5 + tmp6;
				tmp12 = tmp6 + tmp7;
	
				/* The rotator is modified from fig 4-8 to avoid extra negations. */
				var z5 = (tmp10 - tmp12) * 0.382683433; /* c6 */
				var z2 = 0.541196100 * tmp10 + z5; /* c2-c6 */
				var z4 = 1.306562965 * tmp12 + z5; /* c2+c6 */
				var z3 = tmp11 * 0.707106781; /* c4 */
	
				var z11 = tmp7 + z3;	/* phase 5 */
				var z13 = tmp7 - z3;
	
				data[dataOff+5] = z13 + z2;	/* phase 6 */
				data[dataOff+3] = z13 - z2;
				data[dataOff+1] = z11 + z4;
				data[dataOff+7] = z11 - z4;
	
				dataOff += 8; /* advance pointer to next row */
			}
	
			/* Pass 2: process columns. */
			dataOff = 0;
			for (i=0; i<I8; ++i)
			{
				d0 = data[dataOff];
				d1 = data[dataOff + 8];
				d2 = data[dataOff + 16];
				d3 = data[dataOff + 24];
				d4 = data[dataOff + 32];
				d5 = data[dataOff + 40];
				d6 = data[dataOff + 48];
				d7 = data[dataOff + 56];
				
				var tmp0p2 = d0 + d7;
				var tmp7p2 = d0 - d7;
				var tmp1p2 = d1 + d6;
				var tmp6p2 = d1 - d6;
				var tmp2p2 = d2 + d5;
				var tmp5p2 = d2 - d5;
				var tmp3p2 = d3 + d4;
				var tmp4p2 = d3 - d4;
	
				/* Even part */
				var tmp10p2 = tmp0p2 + tmp3p2;	/* phase 2 */
				var tmp13p2 = tmp0p2 - tmp3p2;
				var tmp11p2 = tmp1p2 + tmp2p2;
				var tmp12p2 = tmp1p2 - tmp2p2;
	
				data[dataOff] = tmp10p2 + tmp11p2; /* phase 3 */
				data[dataOff+32] = tmp10p2 - tmp11p2;
	
				var z1p2 = (tmp12p2 + tmp13p2) * 0.707106781; /* c4 */
				data[dataOff+16] = tmp13p2 + z1p2; /* phase 5 */
				data[dataOff+48] = tmp13p2 - z1p2;
	
				/* Odd part */
				tmp10p2 = tmp4p2 + tmp5p2; /* phase 2 */
				tmp11p2 = tmp5p2 + tmp6p2;
				tmp12p2 = tmp6p2 + tmp7p2;
	
				/* The rotator is modified from fig 4-8 to avoid extra negations. */
				var z5p2 = (tmp10p2 - tmp12p2) * 0.382683433; /* c6 */
				var z2p2 = 0.541196100 * tmp10p2 + z5p2; /* c2-c6 */
				var z4p2 = 1.306562965 * tmp12p2 + z5p2; /* c2+c6 */
				var z3p2 = tmp11p2 * 0.707106781; /* c4 */
	
				var z11p2 = tmp7p2 + z3p2;	/* phase 5 */
				var z13p2 = tmp7p2 - z3p2;
	
				data[dataOff+40] = z13p2 + z2p2; /* phase 6 */
				data[dataOff+24] = z13p2 - z2p2;
				data[dataOff+ 8] = z11p2 + z4p2;
				data[dataOff+56] = z11p2 - z4p2;
	
				dataOff++; /* advance pointer to next column */
			}
	
			// Quantize/descale the coefficients
			var fDCTQuant;
			for (i=0; i<I64; ++i)
			{
				// Apply the quantization and scaling factor & Round to nearest integer
				fDCTQuant = data[i]*fdtbl[i];
				outputfDCTQuant[i] = (fDCTQuant > 0.0) ? ((fDCTQuant + 0.5)|0) : ((fDCTQuant - 0.5)|0);
				//outputfDCTQuant[i] = fround(fDCTQuant);

			}
			return outputfDCTQuant;
		}
		
		function writeAPP0()
		{
			writeWord(0xFFE0); // marker
			writeWord(16); // length
			writeByte(0x4A); // J
			writeByte(0x46); // F
			writeByte(0x49); // I
			writeByte(0x46); // F
			writeByte(0); // = "JFIF",'\0'
			writeByte(1); // versionhi
			writeByte(1); // versionlo
			writeByte(0); // xyunits
			writeWord(1); // xdensity
			writeWord(1); // ydensity
			writeByte(0); // thumbnwidth
			writeByte(0); // thumbnheight
		}

		function writeAPP1(exifBuffer) {
			if (!exifBuffer) return;

			writeWord(0xFFE1); // APP1 marker

			if (exifBuffer[0] === 0x45 &&
					exifBuffer[1] === 0x78 &&
					exifBuffer[2] === 0x69 &&
					exifBuffer[3] === 0x66) {
				// Buffer already starts with EXIF, just use it directly
				writeWord(exifBuffer.length + 2); // length is buffer + length itself!
			} else {
				// Buffer doesn't start with EXIF, write it for them
				writeWord(exifBuffer.length + 5 + 2); // length is buffer + EXIF\0 + length itself!
				writeByte(0x45); // E
				writeByte(0x78); // X
				writeByte(0x69); // I
				writeByte(0x66); // F
				writeByte(0); // = "EXIF",'\0'
			}

			for (var i = 0; i < exifBuffer.length; i++) {
				writeByte(exifBuffer[i]);
			}
		}

		function writeSOF0(width, height)
		{
			writeWord(0xFFC0); // marker
			writeWord(17);   // length, truecolor YUV JPG
			writeByte(8);    // precision
			writeWord(height);
			writeWord(width);
			writeByte(3);    // nrofcomponents
			writeByte(1);    // IdY
			writeByte(0x11); // HVY
			writeByte(0);    // QTY
			writeByte(2);    // IdU
			writeByte(0x11); // HVU
			writeByte(1);    // QTU
			writeByte(3);    // IdV
			writeByte(0x11); // HVV
			writeByte(1);    // QTV
		}
	
		function writeDQT()
		{
			writeWord(0xFFDB); // marker
			writeWord(132);	   // length
			writeByte(0);
			for (var i=0; i<64; i++) {
				writeByte(YTable[i]);
			}
			writeByte(1);
			for (var j=0; j<64; j++) {
				writeByte(UVTable[j]);
			}
		}
	
		function writeDHT()
		{
			writeWord(0xFFC4); // marker
			writeWord(0x01A2); // length
	
			writeByte(0); // HTYDCinfo
			for (var i=0; i<16; i++) {
				writeByte(std_dc_luminance_nrcodes[i+1]);
			}
			for (var j=0; j<=11; j++) {
				writeByte(std_dc_luminance_values[j]);
			}
	
			writeByte(0x10); // HTYACinfo
			for (var k=0; k<16; k++) {
				writeByte(std_ac_luminance_nrcodes[k+1]);
			}
			for (var l=0; l<=161; l++) {
				writeByte(std_ac_luminance_values[l]);
			}
	
			writeByte(1); // HTUDCinfo
			for (var m=0; m<16; m++) {
				writeByte(std_dc_chrominance_nrcodes[m+1]);
			}
			for (var n=0; n<=11; n++) {
				writeByte(std_dc_chrominance_values[n]);
			}
	
			writeByte(0x11); // HTUACinfo
			for (var o=0; o<16; o++) {
				writeByte(std_ac_chrominance_nrcodes[o+1]);
			}
			for (var p=0; p<=161; p++) {
				writeByte(std_ac_chrominance_values[p]);
			}
		}
		
		function writeCOM(comments)
		{
			if (typeof comments === "undefined" || comments.constructor !== Array) return;
			comments.forEach(e => {
				if (typeof e !== "string") return;
				writeWord(0xFFFE); // marker
				var l = e.length;
				writeWord(l + 2); // length itself as well
				var i;
				for (i = 0; i < l; i++)
					writeByte(e.charCodeAt(i));
			});
		}
	
		function writeSOS()
		{
			writeWord(0xFFDA); // marker
			writeWord(12); // length
			writeByte(3); // nrofcomponents
			writeByte(1); // IdY
			writeByte(0); // HTY
			writeByte(2); // IdU
			writeByte(0x11); // HTU
			writeByte(3); // IdV
			writeByte(0x11); // HTV
			writeByte(0); // Ss
			writeByte(0x3f); // Se
			writeByte(0); // Bf
		}
		
		function processDU(CDU, fdtbl, DC, HTDC, HTAC){
			var EOB = HTAC[0x00];
			var M16zeroes = HTAC[0xF0];
			var pos;
			var I16 = 16;
			var I63 = 63;
			var I64 = 64;
			var DU_DCT = fDCTQuant(CDU, fdtbl);
			//ZigZag reorder
			for (var j=0;j<I64;++j) {
				DU[ZigZag[j]]=DU_DCT[j];
			}
			var Diff = DU[0] - DC; DC = DU[0];
			//Encode DC
			if (Diff==0) {
				writeBits(HTDC[0]); // Diff might be 0
			} else {
				pos = 32767+Diff;
				writeBits(HTDC[category[pos]]);
				writeBits(bitcode[pos]);
			}
			//Encode ACs
			var end0pos = 63; // was const... which is crazy
			for (; (end0pos>0)&&(DU[end0pos]==0); end0pos--) {};
			//end0pos = first element in reverse order !=0
			if ( end0pos == 0) {
				writeBits(EOB);
				return DC;
			}
			var i = 1;
			var lng;
			while ( i <= end0pos ) {
				var startpos = i;
				for (; (DU[i]==0) && (i<=end0pos); ++i) {}
				var nrzeroes = i-startpos;
				if ( nrzeroes >= I16 ) {
					lng = nrzeroes>>4;
					for (var nrmarker=1; nrmarker <= lng; ++nrmarker)
						writeBits(M16zeroes);
					nrzeroes = nrzeroes&0xF;
				}
				pos = 32767+DU[i];
				writeBits(HTAC[(nrzeroes<<4)+category[pos]]);
				writeBits(bitcode[pos]);
				i++;
			}
			if ( end0pos != I63 ) {
				writeBits(EOB);
			}
			return DC;
		}

		function initCharLookupTable(){
			var sfcc = String.fromCharCode;
			for(var i=0; i < 256; i++){ ///// ACHTUNG // 255
				clt[i] = sfcc(i);
			}
		}
		

		// ---- 띠(strip) 단위 스트리밍 인코딩 (데이트백용 수정) ----
		var sW=0, sH=0, sY=0, DCY=0, DCU=0, DCV=0;
		this.begin = function(width, height, app1){
			buf = new Uint8Array(1<<20); bufPos = 0; chunks = [];
			bytenew=0; bytepos=7; sW=width; sH=height; sY=0; DCY=0; DCU=0; DCV=0;
			writeWord(0xFFD8);
			writeAPP0();
			if (app1) { for (var i=0;i<app1.length;i++) writeByte(app1[i]); }
			writeDQT(); writeSOF0(width,height); writeDHT(); writeSOS();
			bytenew=0; bytepos=7;
		};
		// data: RGBA, 폭 sW, 행 수 rows (마지막 띠 외에는 8의 배수)
		this.addStrip = function(imageData, rows){
			var quadWidth = sW*4, x, y=0, r,g,b, start,p,col,row,pos;
			while(y < rows){
				x = 0;
				while(x < quadWidth){
					start = quadWidth * y + x;
					for(pos=0; pos < 64; pos++){
						row = pos >> 3; col = ( pos & 7 ) * 4;
						p = start + ( row * quadWidth ) + col;
						if(y+row >= rows){ p-= (quadWidth*(y+1+row-rows)); }
						if(x+col >= quadWidth){ p-= ((x+col) - quadWidth +4); }
						r = imageData[ p++ ]; g = imageData[ p++ ]; b = imageData[ p++ ];
						YDU[pos] = ((RGB_YUV_TABLE[r] + RGB_YUV_TABLE[(g + 256)>>0] + RGB_YUV_TABLE[(b + 512)>>0]) >> 16)-128;
						UDU[pos] = ((RGB_YUV_TABLE[(r + 768)>>0] + RGB_YUV_TABLE[(g + 1024)>>0] + RGB_YUV_TABLE[(b + 1280)>>0]) >> 16)-128;
						VDU[pos] = ((RGB_YUV_TABLE[(r + 1280)>>0] + RGB_YUV_TABLE[(g + 1536)>>0] + RGB_YUV_TABLE[(b + 1792)>>0]) >> 16)-128;
					}
					DCY = processDU(YDU, fdtbl_Y, DCY, YDC_HT, YAC_HT);
					DCU = processDU(UDU, fdtbl_UV, DCU, UVDC_HT, UVAC_HT);
					DCV = processDU(VDU, fdtbl_UV, DCV, UVDC_HT, UVAC_HT);
					x+=32;
				}
				y+=8;
			}
			sY += rows;
		};
		this.finish = function(){
			if ( bytepos >= 0 ) { var fillbits = []; fillbits[1] = bytepos+1; fillbits[0] = (1<<(bytepos+1))-1; writeBits(fillbits); }
			writeWord(0xFFD9);
			var out = chunks.concat([buf.subarray(0, bufPos)]);
			chunks = []; buf = new Uint8Array(1); bufPos = 0;
			return out;
		};

	function setQuality(quality){
		if (quality <= 0) {
			quality = 1;
		}
		if (quality > 100) {
			quality = 100;
		}
		
		if(currentQuality == quality) return // don't recalc if unchanged
		
		var sf = 0;
		if (quality < 50) {
			sf = Math.floor(5000 / quality);
		} else {
			sf = Math.floor(200 - quality*2);
		}
		
		initQuantTables(sf);
		currentQuality = quality;
		//console.log('Quality set to: '+quality +'%');
	}
	
	function init(){
		var time_start = new Date().getTime();
		if(!quality) quality = 50;
		// Create tables
		initCharLookupTable()
		initHuffmanTbl();
		initCategoryNumber();
		initRGBYUVTable();
		
		setQuality(quality);
		var duration = new Date().getTime() - time_start;
    	//console.log('Initialization '+ duration + 'ms');
	}
	
	init();
	
};

<script>
(() => {
  // ---------- 7-segment glyphs ----------
  const SEG = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd',
               '6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
  const COLORS = {
    orange:{core:'#FFA347', glow:'#FF6A00'},
    red:   {core:'#FF7A45', glow:'#FF3300'},
    amber: {core:'#FFC864', glow:'#FF9000'}
  };
  const FORMATS = [
    {id:'classic', label:"'98  7 15"},
    {id:'yymmdd',  label:'98 07 15'},
    {id:'mdy',     label:" 7 15 '98"},
    {id:'dmy',     label:"15  7 '98"},
    {id:'ymd4',    label:'1998 07 15'}
  ];

  function dateString(y, m, d, fmt){
    const YY = String(y % 100).padStart(2,'0');
    const z = n => String(n).padStart(2,'0');
    const b = n => (n < 10 ? '_' : '') + n;          // '_' = 빈 자리(불 꺼진 자리)
    switch(fmt){
      case 'yymmdd': return `${YY} ${z(m)} ${z(d)}`;
      case 'mdy':    return `${b(m)} ${b(d)} '${YY}`;
      case 'dmy':    return `${b(d)} ${b(m)} '${YY}`;
      case 'ymd4':   return `${y} ${z(m)} ${z(d)}`;
      default:       return `'${YY} ${b(m)} ${b(d)}`;
    }
  }

  // 글자 배치: h = 글자 높이
  function layout(str, h){
    const W = 0.56*h, gap = 0.2*h, sep = 0.34*h, ap = 0.17*h;
    const out = []; let x = 0;
    for(const ch of str){
      if(ch === ' '){ x += sep; continue; }
      if(ch === "'"){ out.push({ch, x}); x += ap + gap*0.6; continue; }
      out.push({ch, x}); x += W + gap;
    }
    return {glyphs: out, width: Math.max(0, x - gap), W};
  }

  function drawText(ctx, str, ox, oy, h, slant){
    const {glyphs, W} = layout(str, h);
    const t = 0.13*h, ht = t/2, g = t*0.2, m = h/2;
    const sk = (px, py) => [ox + px + (h - py)*slant, oy + py];
    const poly = pts => { ctx.beginPath(); pts.forEach(([px,py],i)=>{ const [X,Y]=sk(px,py); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.closePath(); ctx.fill(); };
    const hor = (x0,x1,y) => [[x0+g,y],[x0+ht+g,y-ht],[x1-ht-g,y-ht],[x1-g,y],[x1-ht-g,y+ht],[x0+ht+g,y+ht]];
    const ver = (x,y0,y1) => [[x,y0+g],[x+ht,y0+ht+g],[x+ht,y1-ht-g],[x,y1-g],[x-ht,y1-ht-g],[x-ht,y0+ht+g]];
    for(const {ch, x} of glyphs){
      if(ch === "'"){ poly([[x+0.04*h,0],[x+0.04*h+t,0],[x+t*0.75,0.3*h],[x,0.3*h]]); continue; }
      const segs = SEG[ch]; if(!segs) continue;
      const L = x + ht, R = x + W - ht;
      const map = {
        a: hor(x+ht, x+W-ht, ht), g: hor(x+ht, x+W-ht, m), d: hor(x+ht, x+W-ht, h-ht),
        f: ver(L, ht, m), b: ver(R, ht, m), e: ver(L, m, h-ht), c: ver(R, m, h-ht)
      };
      for(const s of segs) poly(map[s]);
    }
  }

  // 사진 위에 날짜를 합성: 준비(한 번) + 그리기(여러 번 가능)
  function prepareStamp(Wc, Hc, str, s){
    const short = Math.min(Wc, Hc);
    const h = short * s.size / 100;
    const {width} = layout(str, h);
    const tw = width + h*s.tilt;
    const margin = short * 0.045;
    const x = s.pos.includes('r') ? Wc - margin - tw : margin;
    const y = s.pos.includes('b') ? Hc - margin - h : margin;
    const pad = Math.ceil(h*1.2);
    const off = document.createElement('canvas');
    off.width = Math.ceil(tw + pad*2); off.height = Math.ceil(h + pad*2);
    const oc = off.getContext('2d');
    const col = COLORS[s.color];
    oc.fillStyle = col.core;
    drawText(oc, str, pad, pad, h, s.tilt);
    const blur = h * (0.15 + s.glow*0.9);
    return {off, dx: x - pad, dy: y - pad, h, col, glow: s.glow, blur,
            top: y - pad - blur*2, bottom: y - pad + off.height + blur*2};
  }
  function drawStamp(ctx, P){
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    if(P.glow > 0){
      ctx.shadowColor = P.col.glow;
      ctx.shadowBlur = P.blur;
      ctx.globalAlpha = 0.55 + P.glow*0.35;
      ctx.drawImage(P.off, P.dx, P.dy);
    }
    ctx.shadowColor = P.col.glow;
    ctx.shadowBlur = P.h * 0.06;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(P.off, P.dx, P.dy);
    ctx.restore();
  }
  function stamp(ctx, Wc, Hc, str, s){ drawStamp(ctx, prepareStamp(Wc, Hc, str, s)); }

  // ---------- 상태 ----------
  const settings = {fmt:'classic', pos:'br', size:5, glow:0.5, tilt:0.1, color:'orange'};
  const items = [];
  let cur = -1;

  const $ = id => document.getElementById(id);
  const view = $('view'), vctx = view.getContext('2d');

  function activeDate(it){
    if(!it) return null;
    return it.source === 'exif' ? it.exif : it.manual;
  }

  function render(){
    const it = items[cur];
    $('empty').hidden = !!it; view.hidden = !it;
    $('saveOne').disabled = !it || !activeDate(it);
    $('saveAll').hidden = items.length < 2;
    $('applyAll').hidden = items.length < 2;
    const si = $('sizeInfo'); si.hidden = !it;
    if(it) si.textContent = `저장 크기: ${it.img.naturalWidth} × ${it.img.naturalHeight} (원본 해상도)` + (it.file.type === 'image/jpeg' ? ', 촬영 정보 유지' : '');
    renderPanel();
    renderStrip();
    if(!it){ drawDemo(); return; }
    const img = it.img, iw = img.naturalWidth, ih = img.naturalHeight;
    const k = Math.min(1, 1600 / Math.max(iw, ih));
    view.width = Math.round(iw*k); view.height = Math.round(ih*k);
    vctx.drawImage(img, 0, 0, view.width, view.height);
    const d = activeDate(it);
    if(d) stamp(vctx, view.width, view.height, dateString(d.y, d.m, d.d, settings.fmt), settings);
  }

  function renderPanel(){
    const it = items[cur];
    const src = it ? it.source : 'exif';
    for(const b of $('srcSeg').children){
      b.setAttribute('aria-pressed', String(b.dataset.src === src));
      if(b.dataset.src === 'exif') b.disabled = !!it && !it.exif;
    }
    const line = $('exifLine');
    if(!it) line.textContent = '사진을 불러오면 촬영 날짜를 읽어옵니다.';
    else if(it.exif) line.innerHTML = `사진 정보의 촬영 날짜: <b>${it.exif.y}년 ${it.exif.m}월 ${it.exif.d}일</b>`;
    else line.textContent = '이 사진에는 촬영 날짜 정보가 없습니다. 날짜를 직접 입력하세요.';
    $('manualBox').hidden = !(it && it.source === 'manual');
    const di = $('dateInput');
    if(it && it.source === 'manual'){
      di.value = it.manual ? `${it.manual.y}-${String(it.manual.m).padStart(2,'0')}-${String(it.manual.d).padStart(2,'0')}` : '';
      di.classList.toggle('need', !it.manual);
    }
  }

  function renderStrip(){
    const strip = $('strip'); strip.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.className = 'thumb'; b.setAttribute('aria-current', String(i === cur));
      b.setAttribute('aria-label', `${it.name} 편집`);
      const im = document.createElement('img'); im.src = it.url; im.alt = '';
      b.appendChild(im);
      if(!activeDate(it)){ const n = document.createElement('span'); n.className='nodate'; n.textContent='날짜 없음'; b.appendChild(n); }
      const del = document.createElement('span');
      del.className = 'del'; del.textContent = '×'; del.setAttribute('role','button'); del.setAttribute('aria-label','목록에서 빼기');
      del.addEventListener('click', e => { e.stopPropagation(); URL.revokeObjectURL(it.url); items.splice(i,1); cur = Math.min(cur, items.length-1); render(); });
      b.appendChild(del);
      b.addEventListener('click', () => { cur = i; render(); });
      strip.appendChild(b);
    });
  }

  function drawDemo(){
    const c = $('demo'), x = c.getContext('2d');
    const gr = x.createLinearGradient(0,0,c.width,c.height);
    gr.addColorStop(0,'#4a5a63'); gr.addColorStop(.55,'#2c3438'); gr.addColorStop(1,'#1a1d1f');
    x.fillStyle = gr; x.fillRect(0,0,c.width,c.height);
    const n = new Date();
    stamp(x, c.width, c.height, dateString(n.getFullYear(), n.getMonth()+1, n.getDate(), settings.fmt), {...settings, size: Math.max(settings.size, 6)});
  }

  // ---------- 불러오기 ----------
  function parseExifDate(v){
    if(v instanceof Date && !isNaN(v)) return {y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate()};
    if(typeof v === 'string'){
      const mm = v.match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})/);
      if(mm && +mm[1] > 1900) return {y:+mm[1], m:+mm[2], d:+mm[3]};
    }
    return null;
  }

  async function addFiles(list){
    const first = items.length;
    for(const f of list){
      const url = URL.createObjectURL(f);
      const img = new Image(); img.src = url;
      try { await img.decode(); }
      catch { URL.revokeObjectURL(url); toast(`${f.name}을(를) 열 수 없습니다. JPG 또는 PNG로 올려 주세요.`); continue; }
      let exif = null;
      try {
        if(window.exifr){
          const r = await exifr.parse(f, ['DateTimeOriginal','CreateDate','DateTimeDigitized']);
          exif = parseExifDate(r?.DateTimeOriginal) || parseExifDate(r?.CreateDate) || parseExifDate(r?.DateTimeDigitized);
        }
      } catch {}
      items.push({file: f, name: f.name, url, img, exif, manual: null, source: exif ? 'exif' : 'manual'});
    }
    if(items.length > first) cur = first;
    render();
  }

  const fileInput = $('file');
  const pick = () => fileInput.click();
  $('pickEmpty').addEventListener('click', pick);
  $('pickMore').addEventListener('click', pick);
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
  document.addEventListener('dragleave', e => { if(!e.relatedTarget) document.body.classList.remove('drag'); });
  document.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('drag');
    const fs = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    if(fs.length) addFiles(fs);
  });

  // ---------- 컨트롤 ----------
  const fmtSeg = $('fmtSeg');
  FORMATS.forEach(f => {
    const b = document.createElement('button');
    b.dataset.fmt = f.id; b.textContent = f.label.replace(/ /g,'\u00a0');
    b.setAttribute('aria-pressed', String(f.id === settings.fmt));
    fmtSeg.appendChild(b);
  });
  function bindSeg(el, key, attr){
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b || b.disabled) return;
      settings[key] = b.dataset[attr];
      for(const x of el.children) x.setAttribute('aria-pressed', String(x === b));
      render();
    });
  }
  bindSeg(fmtSeg, 'fmt', 'fmt');
  bindSeg($('posSeg'), 'pos', 'pos');
  bindSeg($('colSeg'), 'color', 'col');

  let raf = 0;
  for(const id of ['size','glow','tilt']){
    $(id).addEventListener('input', e => {
      settings[id] = parseFloat(e.target.value);
      cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
    });
  }

  $('srcSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); const it = items[cur];
    if(!b || b.disabled || !it) return;
    it.source = b.dataset.src;
    if(it.source === 'manual' && !it.manual && it.exif) it.manual = {...it.exif};
    render();
    if(it.source === 'manual') $('dateInput').focus();
  });

  $('dateInput').addEventListener('change', e => {
    const it = items[cur]; if(!it) return;
    const v = e.target.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    it.manual = v ? {y:+v[1], m:+v[2], d:+v[3]} : null;
    render();
  });

  $('applyAll').addEventListener('click', () => {
    const it = items[cur]; if(!it || !it.manual) { toast('먼저 날짜를 입력하세요.'); return; }
    items.forEach(o => { o.manual = {...it.manual}; o.source = 'manual'; });
    toast(`${items.length}장 모두 같은 날짜로 바꿨습니다.`);
    render();
  });

  // ---------- 저장 ----------
  // --- EXIF(APP1) 추출: 회전값은 1로, 픽셀 크기는 결과물 크기로 고쳐서 옮김 ---
  async function readApp1(file, outW, outH){
    try{
      const u8 = new Uint8Array(await file.slice(0, 262144).arrayBuffer());
      if(u8[0] !== 0xFF || u8[1] !== 0xD8) return null;
      let p = 2;
      while(p + 4 <= u8.length && u8[p] === 0xFF){
        const mk = u8[p+1];
        if(mk === 0xDA || mk === 0xD9) break;
        const len = (u8[p+2] << 8) | u8[p+3];
        if(mk === 0xE1 && u8[p+4]===0x45 && u8[p+5]===0x78 && u8[p+6]===0x69 && u8[p+7]===0x66 && u8[p+8]===0 && u8[p+9]===0){
          if(p + 2 + len > u8.length) return null;
          const seg = u8.slice(p, p + 2 + len);
          patchExif(seg, outW, outH);
          return seg;
        }
        p += 2 + len;
      }
    }catch{}
    return null;
  }
  function patchExif(seg, outW, outH){
    const T = 10, dv = new DataView(seg.buffer, seg.byteOffset, seg.byteLength);
    const le = seg[T] === 0x49;
    const u16 = o => dv.getUint16(o, le), u32 = o => dv.getUint32(o, le);
    const walk = (ifd, fn) => {
      const at = T + ifd; if(at + 2 > seg.length) return;
      const n = u16(at);
      for(let i = 0; i < n; i++){ const e = at + 2 + i*12; if(e + 12 > seg.length) return; fn(e, u16(e), u16(e+2)); }
    };
    let exifIfd = 0;
    walk(u32(T+4), (e, tag) => {
      if(tag === 0x0112) dv.setUint16(e+8, 1, le);          // 방향: 정방향
      if(tag === 0x8769) exifIfd = u32(e+8);
    });
    if(exifIfd) walk(exifIfd, (e, tag, type) => {
      if(tag === 0xA002 || tag === 0xA003){
        const v = tag === 0xA002 ? outW : outH;
        if(type === 3) dv.setUint16(e+8, v, le); else if(type === 4) dv.setUint32(e+8, v, le);
      }
    });
  }
  function insertApp1(u8, app1){                               // 브라우저가 만든 JPG에 EXIF 끼워 넣기
    let at = 2;
    if(u8[2] === 0xFF && u8[3] === 0xE0) at = 4 + ((u8[4] << 8) | u8[5]);
    const out = new Uint8Array(u8.length + app1.length);
    out.set(u8.subarray(0, at)); out.set(app1, at); out.set(u8.subarray(at), at + app1.length);
    return out;
  }

  const canvasCache = new Map();
  function canvasFits(w, h){                                   // 이 기기가 해당 크기의 캔버스를 다룰 수 있는지 실측
    const k = w + 'x' + h; if(canvasCache.has(k)) return canvasCache.get(k);
    let ok = false;
    try{
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d');
      if(x){ x.fillStyle = '#fff'; x.fillRect(w-1, h-1, 1, 1); ok = x.getImageData(w-1, h-1, 1, 1).data[3] === 255; }
      c.width = c.height = 0;
    }catch{ ok = false; }
    canvasCache.set(k, ok); return ok;
  }

  const tick = () => new Promise(r => setTimeout(r, 0));

  // 방식 A: 한 장의 캔버스 (빠름)
  async function exportDirect(it, W, H, str){
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.drawImage(it.img, 0, 0, W, H);
    stamp(x, W, H, str, settings);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
    c.width = c.height = 0;
    return blob;
  }

  // 방식 B: 띠 단위 처리 + 자체 JPG 압축 (캔버스 한도 우회)
  async function exportStrips(it, W, H, str, app1, onProgress){
    const enc = new JPEGEncoder(93);
    enc.begin(W, H, app1);
    const P = prepareStamp(W, H, str, settings);
    const S = 128;
    const c = document.createElement('canvas'); c.width = W; c.height = S;
    const x = c.getContext('2d', {willReadFrequently: true});
    if(!x) throw new Error('canvas');
    for(let y = 0; y < H; y += S){
      const rows = Math.min(S, H - y);
      if(c.height !== rows) c.height = rows;
      x.clearRect(0, 0, W, rows);
      x.drawImage(it.img, 0, y, W, rows, 0, 0, W, rows);
      if(y + rows > P.top && y < P.bottom){ x.save(); x.translate(0, -y); drawStamp(x, P); x.restore(); }
      enc.addStrip(x.getImageData(0, 0, W, rows).data, rows);
      onProgress && onProgress((y + rows) / H);
      await tick();
    }
    c.width = c.height = 0;
    return new Blob(enc.finish(), {type: 'image/jpeg'});
  }

  async function exportBlob(it, onProgress){
    const W = it.img.naturalWidth, H = it.img.naturalHeight;
    const d = activeDate(it);
    const str = dateString(d.y, d.m, d.d, settings.fmt);
    const app1 = await readApp1(it.file, W, H);
    if(canvasFits(W, H)){
      const blob = await exportDirect(it, W, H, str);
      if(blob){
        if(!app1) return {blob, full: true};
        const u8 = new Uint8Array(await blob.arrayBuffer());
        return {blob: new Blob([insertApp1(u8, app1)], {type: 'image/jpeg'}), full: true};
      }
    }
    try{
      return {blob: await exportStrips(it, W, H, str, app1, onProgress), full: true};
    }catch(e){
      // 마지막 안전장치: 1,600만 화소로 줄여서 저장
      const k = Math.min(1, Math.sqrt(16e6 / (W*H)));
      const w2 = Math.round(W*k), h2 = Math.round(H*k);
      return {blob: await exportDirect(it, w2, h2, str), full: false};
    }
  }
  const outName = it => it.name.replace(/\.[^.]+$/, '') + '_date.jpg';

  // ---------- 결과 시트 ----------
  const sh = {el:$('sheet'), img:$('shImg'), msg:$('shMsg'), share:$('shShare'), down:$('shDown'), close:$('shClose'), hint:$('shHint')};
  let shUrl = null;
  function sheetBusy(text){
    sh.el.classList.add('open'); sh.msg.textContent = text;
    sh.img.hidden = true; sh.share.hidden = sh.down.hidden = sh.close.hidden = sh.hint.hidden = true;
  }
  const isTouch = matchMedia('(pointer:coarse)').matches;
  function canShareFiles(files){ try{ return !!(navigator.canShare && navigator.canShare({files})); }catch{ return false; } }
  function downloadFile(f){
    const u = URL.createObjectURL(f);
    const a = document.createElement('a'); a.href = u; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  }
  // files: File[] → 사용자가 저장/닫기를 마칠 때까지 대기
  function sheetReady(files, note){
    return new Promise(resolve => {
      if(shUrl) URL.revokeObjectURL(shUrl);
      shUrl = URL.createObjectURL(files[0]);
      sh.img.src = shUrl; sh.img.hidden = false;
      sh.msg.textContent = (files.length > 1 ? `${files.length}장이 준비되었습니다.` : '저장할 준비가 되었습니다.') + (note ? ' ' + note : '');
      const share = canShareFiles(files);
      sh.share.hidden = !share; sh.down.hidden = false; sh.close.hidden = false; sh.hint.hidden = !isTouch;
      sh.share.className = 'btn ' + (share && isTouch ? 'primary' : 'ghost');
      sh.down.className = 'btn ' + (share && isTouch ? 'ghost' : 'primary');
      if(share && isTouch) sh.share.after(sh.down); else sh.down.after(sh.share);
      const done = ok => { sh.share.onclick = sh.down.onclick = sh.close.onclick = null; resolve(ok); };
      sh.share.onclick = async () => {
        try{ await navigator.share({files}); done(true); }
        catch(e){ if(e && e.name !== 'AbortError') toast('공유 창을 열지 못했습니다. 파일로 내려받기를 이용하세요.'); }
      };
      sh.down.onclick = () => { files.forEach((f, i) => setTimeout(() => downloadFile(f), i*400)); done(true); };
      sh.close.onclick = () => done(false);
    });
  }
  function sheetClose(){ sh.el.classList.remove('open'); if(shUrl){ URL.revokeObjectURL(shUrl); shUrl = null; } sh.img.removeAttribute('src'); }

  async function makeFile(it, prefix){
    const res = await exportBlob(it, f => { sh.msg.textContent = `${prefix} ${Math.round(f*100)}%`; });
    if(!res.blob) throw new Error('blob');
    return {file: new File([res.blob], outName(it), {type:'image/jpeg'}), full: res.full};
  }

  $('saveOne').addEventListener('click', async () => {
    const it = items[cur]; if(!it) return;
    sheetBusy('사진을 만드는 중');
    await tick();
    try{
      const r = await makeFile(it, '사진을 만드는 중');
      const ok = await sheetReady([r.file], r.full ? '' : '(메모리 한도로 1,600만 화소로 줄였습니다)');
      if(ok) toast('저장했습니다.');
    }catch{ toast('이미지를 만들지 못했습니다. 다른 사진으로 시도해 보세요.'); }
    sheetClose();
  });

  $('saveAll').addEventListener('click', async () => {
    const ready = items.filter(activeDate);
    const skipped = items.length - ready.length;
    const BATCH = 10;                                         // 휴대폰 메모리를 고려해 10장씩 나눔
    let saved = 0;
    try{
      for(let s0 = 0; s0 < ready.length; s0 += BATCH){
        const group = ready.slice(s0, s0 + BATCH), files = [];
        let reduced = false;
        sheetBusy('사진을 만드는 중'); await tick();
        for(let i = 0; i < group.length; i++){
          const r = await makeFile(group[i], `${s0+i+1}/${ready.length}장 만드는 중`);
          files.push(r.file); if(!r.full) reduced = true;
        }
        const range = ready.length > BATCH ? `(${s0+1}–${s0+group.length}번째)` : '';
        const ok = await sheetReady(files, [range, reduced ? '일부는 메모리 한도로 줄였습니다.' : ''].filter(Boolean).join(' '));
        if(!ok) break;
        saved += files.length;
      }
    }catch{ toast('일부 사진을 만들지 못했습니다.'); }
    sheetClose();
    if(saved) toast(`${saved}장 저장했습니다.` + (skipped ? ` 날짜가 없는 ${skipped}장은 건너뛰었습니다.` : ''));
  });

  let tt;
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

  render();

  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
